---
# SPDX-License-Identifier: Apache-2.0
# SPDX-FileCopyrightText: 2024 The Linux Foundation

# pinned-versions-action
name: '📌 Pinned Versions Action'
description: 'Verifies action/workflow calls are pinned to SHA commit values'

inputs:
  path_prefix:
    description: 'Directory location containing project code'
    required: false
    default: '.'
  no_checkout:
    description: 'Do not checkout local repository; used for testing'
    required: false
    default: 'false'
  full_scan:
    description: >-
      Force a full repository scan even on pull_request events
      (default: pull_request events scan only changed workflow files)
    required: false
    default: 'false'
  linter_version:
    description: >-
      Optional gha-workflow-linter version to install from PyPI
      (e.g. '1.0.2'). When unset, the action installs the latest
      released version on each run.
    required: false
    default: ''

runs:
  using: 'composite'
  steps:
    # Checkout repository on manual invocation (or any non-PR event)
    - name: 'Checkout repository'
      # yamllint disable-line rule:line-length
      if: github.event_name != 'pull_request' && inputs.no_checkout != 'true'
      # yamllint disable-line rule:line-length
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      with:
        # Read-only checkout: the action only inspects working-tree files,
        # so a shallow checkout suffices and credentials need not persist.
        persist-credentials: false

    # Checkout change when invoked on a pull request
    - name: 'Checkout pull request'
      # yamllint disable-line rule:line-length
      if: github.event_name == 'pull_request' && inputs.no_checkout != 'true'
      # yamllint disable-line rule:line-length
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      with:
        ref: "${{ github.event.pull_request.head.sha }}"
        # Read-only checkout: shallow + no persisted credentials.
        persist-credentials: false

    - name: 'Check path_prefix directory'
      if: inputs.path_prefix != '.'
      shell: bash
      env:
        INPUT_PATH_PREFIX: ${{ inputs.path_prefix }}
      run: |
        # Validate path_prefix
        if [ ! -d "$INPUT_PATH_PREFIX" ]; then
          echo 'Error: path_prefix is not a valid directory ❌'
          echo "$INPUT_PATH_PREFIX"
          exit 1
        fi

    # ------------------------------------------------------------------
    # Pull request: gather changed workflow/action YAML files via
    # repository-metadata-action and lint only those. All step-summary
    # output and artifact uploads from that action are suppressed; other
    # actions/workflows in the same job typically already render that
    # summary content, so we deliberately avoid duplicating it here.
    # ------------------------------------------------------------------
    - name: 'Repository metadata (pull request changed files)'
      id: metadata
      # yamllint disable-line rule:line-length
      if: github.event_name == 'pull_request' && inputs.full_scan != 'true'
      # yamllint disable-line rule:line-length
      uses: lfreleng-actions/repository-metadata-action@ad59def638674f45db5c8084a03db60f52cdd3ea # v0.3.4
      with:
        github_token: ${{ github.token }}
        github_summary: 'false'
        gerrit_summary: 'false'
        files_summary: 'false'
        artifact_upload: 'false'

    - name: 'Filter changed workflow/action files'
      id: filter
      # yamllint disable-line rule:line-length
      if: github.event_name == 'pull_request' && inputs.full_scan != 'true'
      shell: bash
      env:
        CHANGED_FILES: ${{ steps.metadata.outputs.changed_files }}
        PATH_PREFIX: ${{ inputs.path_prefix }}
      run: |
        # Filter changed files to YAML under .github (rel to path_prefix).
        # Normalise the prefix so common relative variants ('./sub', 'sub/')
        # match the unprefixed paths emitted by repository-metadata-action.
        prefix="${PATH_PREFIX#./}"
        prefix="${prefix%/}"
        if [ "$prefix" = "." ] || [ -z "$prefix" ]; then
          gh_dir=".github"
        else
          gh_dir="${prefix}/.github"
        fi

        # Write the matched-files list under RUNNER_TEMP so we never clash
        # with files in the caller repository's workspace.
        matched_file="${RUNNER_TEMP:-/tmp}/pinned-versions-matched.txt"
        : > "$matched_file"
        # Restrict the match to actual workflow/composite-action definitions
        # (anything else under .github/ — such as dependabot.yml or
        # actionlint.yaml — is not in scope for SHA-pin / call-target
        # validation and may not even be valid GHA YAML).
        workflows_dir="${gh_dir}/workflows"
        actions_dir="${gh_dir}/actions"

        # changed_files from repository-metadata-action is newline-separated
        while IFS= read -r f; do
          [ -z "$f" ] && continue
          match=false
          # Workflow files: any *.yml/*.yaml directly under .github/workflows/
          # (GitHub does not recurse, but we accept nested paths defensively).
          if [ "${f#"${workflows_dir}/"}" != "$f" ]; then
            case "$f" in
              *.yml|*.yaml) match=true ;;
            esac
          fi
          # Composite actions: action.yml / action.yaml under
          # .github/actions/, including the root-level case
          # (.github/actions/action.yml without an intermediate dir).
          if [ "$match" = false ] \
            && [ "${f#"${actions_dir}/"}" != "$f" ]; then
            case "${f#"${actions_dir}/"}" in
              action.yml|action.yaml|*/action.yml|*/action.yaml)
                match=true ;;
            esac
          fi
          if [ "$match" = true ]; then
            # Confirm the file still exists in the checkout (renames /
            # deletions may otherwise drop out)
            if [ -f "$f" ]; then
              echo "$f" >> "$matched_file"
            fi
          fi
        done <<< "$CHANGED_FILES"

        if [ -s "$matched_file" ]; then
          count=$(wc -l < "$matched_file" | tr -d ' ')
          echo "Found $count changed workflow/action file(s) to lint:"
          sed 's/^/  - /' "$matched_file"
          echo "have_changes=true" >> "$GITHUB_OUTPUT"
          echo "matched_file=${matched_file}" >> "$GITHUB_OUTPUT"
        else
          echo 'No workflow/action changes in scope for check ⏩'
          echo "have_changes=false" >> "$GITHUB_OUTPUT"
        fi

    # ------------------------------------------------------------------
    # Install uv and resolve the linter version only when we know the
    # linter will actually run. On pull_request events that touch no
    # workflow/action YAML, this avoids an unnecessary uv install and
    # PyPI fetch.
    #
    # A composite action inherits the caller's environment, so neither
    # workspace files nor caller variables (PATH, UV_PYTHON,
    # VIRTUAL_ENV, CONDA_PREFIX, PYTHONPATH and so on) may choose the
    # interpreter this action runs. setup-uv's only uv call for these
    # inputs is "uv python find", whose result it executes. An invalid
    # preference makes uv refuse its arguments before any lookup;
    # setup-uv then reports the Python version as "unknown", which
    # nothing reads.
    # ------------------------------------------------------------------
    - name: 'Setup uv'
      id: setup-uv
      # yamllint disable-line rule:line-length
      if: github.event_name != 'pull_request' || inputs.full_scan == 'true' || steps.filter.outputs.have_changes == 'true'
      # yamllint disable-line rule:line-length
      uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2  # v10.3.3
      with:
        working-directory: "${{ github.action_path }}"
        # Without it setup-uv puts the caller's HOME/XDG_* bin dir on PATH
        tool-bin-dir: "${{ runner.temp }}/pinned-versions-action/bin"
        # The post-step "uv cache prune" would hit the invalid preference
        enable-cache: false
      env:
        UV_NO_CONFIG: '1'
        UV_NO_PROJECT: '1'
        UV_PYTHON_PREFERENCE: 'lookup-disabled'
        # Inherited, it makes setup-uv probe uv, which the line above fails
        UV_PYTHON_ARCH: ''
        # yamllint disable-line rule:line-length
        UV_PYTHON_INSTALL_DIR: "${{ runner.temp }}/pinned-versions-action/python"

    # A trusted interpreter: uv installs its own pinned, hash-checked
    # build. uv runs with an empty environment plus an allow-list, so
    # no caller variable can pick or redirect the interpreter.
    - name: 'Install Python'
      id: python
      # yamllint disable-line rule:line-length
      if: github.event_name != 'pull_request' || inputs.full_scan == 'true' || steps.filter.outputs.have_changes == 'true'
      shell: bash
      working-directory: "${{ github.action_path }}"
      env:
        UV: "${{ steps.setup-uv.outputs.uv-path }}"
        INSTALL_DIR: "${{ runner.temp }}/pinned-versions-action/python"
        CACHE_DIR: "${{ runner.temp }}/pinned-versions-action/cache"
        PYTHON_VERSION: '3.13'
      run: |
        # Install a uv-managed Python and record its absolute path
        clean=(UV_NO_CONFIG=1 UV_NO_PROJECT=1
          "UV_PYTHON_INSTALL_DIR=$INSTALL_DIR" "UV_CACHE_DIR=$CACHE_DIR")
        for name in HTTP_PROXY HTTPS_PROXY ALL_PROXY NO_PROXY http_proxy \
            https_proxy all_proxy no_proxy SSL_CERT_FILE SSL_CERT_DIR \
            UV_NATIVE_TLS; do
          if [ -n "${!name+set}" ]; then clean+=("$name=${!name}"); fi
        done
        env -i "${clean[@]}" "$UV" python install --quiet --no-bin \
          "$PYTHON_VERSION"
        PYTHON=$(env -i "${clean[@]}" "$UV" python find --managed-python \
          "$PYTHON_VERSION")
        case "$PYTHON" in
          "$INSTALL_DIR"/*) ;;
          *) echo "Error: uv found Python outside its install directory ❌"
             exit 1 ;;
        esac
        echo "path=$PYTHON" >> "$GITHUB_OUTPUT"

    - name: 'Resolve gha-workflow-linter version'
      id: resolve_version
      # yamllint disable-line rule:line-length
      if: github.event_name != 'pull_request' || inputs.full_scan == 'true' || steps.filter.outputs.have_changes == 'true'
      shell: bash
      env:
        LINTER_VERSION: ${{ inputs.linter_version }}
      run: |
        # Build the requirement specifier; pin to a version when supplied.
        # Validate the user-supplied value against a conservative pattern
        # before writing it to GITHUB_OUTPUT to avoid workflow command
        # injection (e.g. embedded newlines).
        if [ -n "$LINTER_VERSION" ]; then
          if ! printf '%s' "$LINTER_VERSION" | \
            grep -Eq '^[A-Za-z0-9][A-Za-z0-9._+-]*$'; then
            echo "Error: linter_version contains invalid characters ❌"
            echo "Provided value: ${LINTER_VERSION}"
            exit 1
          fi
          spec="gha-workflow-linter==${LINTER_VERSION}"
          echo "Pinning gha-workflow-linter to version: ${LINTER_VERSION}"
        else
          spec="gha-workflow-linter"
          echo "Using latest released gha-workflow-linter from PyPI"
        fi
        echo "linter_spec=${spec}" >> "$GITHUB_OUTPUT"

    # Install the linter into an action-owned virtual environment built
    # on the trusted interpreter. uv queries that interpreter, which
    # would read caller PYTHON* variables (PYTHONHOME redirects the
    # install), so uv again runs with an empty environment plus the
    # allow-list from the step above.
    - name: 'Install gha-workflow-linter'
      id: install
      # yamllint disable-line rule:line-length
      if: github.event_name != 'pull_request' || inputs.full_scan == 'true' || steps.filter.outputs.have_changes == 'true'
      shell: bash
      working-directory: "${{ github.action_path }}"
      env:
        UV: "${{ steps.setup-uv.outputs.uv-path }}"
        PYTHON: "${{ steps.python.outputs.path }}"
        VENV: "${{ runner.temp }}/pinned-versions-action/venv"
        CACHE_DIR: "${{ runner.temp }}/pinned-versions-action/cache"
        LINTER_SPEC: "${{ steps.resolve_version.outputs.linter_spec }}"
      run: |
        # Create the environment afresh so a second run reinstalls
        clean=(UV_NO_CONFIG=1 UV_NO_PROJECT=1 "UV_CACHE_DIR=$CACHE_DIR")
        for name in HTTP_PROXY HTTPS_PROXY ALL_PROXY NO_PROXY http_proxy \
            https_proxy all_proxy no_proxy SSL_CERT_FILE SSL_CERT_DIR \
            UV_NATIVE_TLS; do
          if [ -n "${!name+set}" ]; then clean+=("$name=${!name}"); fi
        done
        env -i "${clean[@]}" "$UV" venv --no-config --quiet --clear \
          --python "$PYTHON" "$VENV"
        env -i "${clean[@]}" "$UV" pip install --no-config --quiet \
          --python "$VENV/bin/python" "$LINTER_SPEC"
        echo "venv=$VENV" >> "$GITHUB_OUTPUT"

    - name: 'Run gha-workflow-linter (pull request changed files)'
      # yamllint disable-line rule:line-length
      if: github.event_name == 'pull_request' && inputs.full_scan != 'true' && steps.filter.outputs.have_changes == 'true'
      shell: bash
      env:
        GITHUB_TOKEN: ${{ github.token }}
        MATCHED_FILE: ${{ steps.filter.outputs.matched_file }}
        VENV: ${{ steps.install.outputs.venv }}
      run: |
        # Lint only the changed workflow/action files (no auto-fix in CI:
        # rewrites in ephemeral runners are pointless and would mask errors)
        args=(--no-auto-fix)
        while IFS= read -r f; do
          [ -z "$f" ] && continue
          args+=(--files "$f")
        done < "$MATCHED_FILE"

        echo "Running gha-workflow-linter on changed files only"
        # -I keeps PYTHON* variables and the workspace out of sys.path;
        # these two still override sys.executable, and so the venv, on -I
        unset PYTHONEXECUTABLE __PYVENV_LAUNCHER__
        "$VENV/bin/python" -I "$VENV/bin/gha-workflow-linter" \
          lint "${args[@]}"

    # ------------------------------------------------------------------
    # Full scan: workflow_dispatch, push, schedule, full_scan=true, etc.
    # ------------------------------------------------------------------
    - name: 'Run gha-workflow-linter (full scan)'
      # yamllint disable-line rule:line-length
      if: github.event_name != 'pull_request' || inputs.full_scan == 'true'
      shell: bash
      env:
        GITHUB_TOKEN: ${{ github.token }}
        INPUT_PATH_PREFIX: ${{ inputs.path_prefix }}
        VENV: ${{ steps.install.outputs.venv }}
      run: |
        # Run gha-workflow-linter against the full path_prefix
        # (no auto-fix: see note in PR-changed-files step above)
        echo "Running gha-workflow-linter against: $INPUT_PATH_PREFIX"
        # -I and unset: see the pull request changed files step above
        unset PYTHONEXECUTABLE __PYVENV_LAUNCHER__
        "$VENV/bin/python" -I "$VENV/bin/gha-workflow-linter" lint \
          --no-auto-fix \
          -- \
          "$INPUT_PATH_PREFIX"
